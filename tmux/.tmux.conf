# ~/.tmux.conf

# ---------------------------------------------------------------------------
# Terminal / color
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"

# Use explicit octal escape sequences (\033) for italic entry (sitm) and exit (ritm)
set -ag terminal-overrides ",xterm-256color:Tc,xterm*:sitm=\033[3m:ritm=\033[23m"
set -as terminal-features ',xterm-256color:clipboard'
set -g set-titles on
set -g set-titles-string "#T"

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind C-e
bind C-e send-keys 'C-e'

# ---------------------------------------------------------------------------
# Splits / panes
# ---------------------------------------------------------------------------
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# vim-tmux-navigator: seamless pane movement between nvim splits and tmux panes
# -n = no prefix. Falls through to send-keys when the active pane is running
# (n)vim, so nvim's own C-h/j/k/l window nav still works there.
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

bind c new-window -c '#{pane_current_path}'

# reload config without restarting the server
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# quick scratch terminal (tmux 3.2+)
bind -n M-t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Copy mode / mouse
# ---------------------------------------------------------------------------
set-window-option -g mode-keys vi
set -g status-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

bind-key M set-option -g mouse \; display "Mouse: #{?mouse,ON,OFF}"
set -g mouse on
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# tmux-better-mouse-mode: without these it just duplicates default mouse behavior
set -g @scroll-speed-num-lines-per-scroll "3"
set -g @scroll-without-changing-pane "on"

# ---------------------------------------------------------------------------
# Behavior
# ---------------------------------------------------------------------------
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @tpm_plugins_get_path '~/.config/tmux/plugins/'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-script-path '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'
set -g @resurrect-restore-script-path '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank: force Wayland clipboard instead of relying on OSC 52
set -g @yank_selection_mouse 'clipboard'
set -g @override_copy_command 'wl-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# theme
# set -g @themepack 'powerline/double/cyan'

# initialize TPM (must be last)
run '/usr/share/tmux-plugin-manager/tpm'
source-file ~/.config/tmux/zenblue.tmux
